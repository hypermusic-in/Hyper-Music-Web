<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Music With AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1a233a 0%, #080c14 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    /* 3D Carousel Container */
    .carousel-container {
      width: 100%;
      max-width: 450px;
      height: 280px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 30px;
    }

    .carousel-track {
      width: 220px;
      height: 220px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .carousel-item {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.5s, opacity 0.5s;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Player Card */
    .player-card {
      background: rgba(22, 32, 51, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Controls */
    .nav-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-play {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      width: 60px;
      height: 60px;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    audio {
      width: 100%;
      outline: none;
      filter: invert(1) hue-rotate(180deg);
      border-radius: 8px;
    }

    .status-msg {
      font-size: 14px;
      color: #38bdf8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="brand-title">Hyper Music With AI</div>

  <div class="carousel-container">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="player-card">
    <div class="song-title" id="songTitle">लोड हो रहा है...</div>
    <div class="artist-name" id="songArtist">कृपया प्रतीक्षा करें</div>

    <div class="nav-buttons">
      <button class="btn" onclick="prevSong()">⏮</button>
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="btn" onclick="nextSong()">⏭</button>
    </div>

    <audio id="audio" controls playsinline preload="auto"></audio>
    <div id="status" class="status-msg">ड्राइव से कनेक्ट हो रहा है...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwovhrtMGCN7r9NGOv1RZPEinw14PQJH77QvcZLekX27iFmwV6yl--wMaeNEBONFvX6/exec";

    let songs = [];
    let currentIndex = 0;
    const track = document.getElementById('track');
    const audio = document.getElementById('audio');
    const title = document.getElementById('songTitle');
    const artist = document.getElementById('songArtist');
    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('status');

    function getAudioStreamUrl(song) {
      if (!song) return "";
      let fileId = song.id;
      if (!fileId && song.audioUrl) {
        const match = song.audioUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match) fileId = match[1];
      }
      if (fileId) {
        return `https://docs.google.com/uc?export=download&id=${fileId}`;
      }
      return song.audioUrl;
    }

    async function fetchSongs() {
      try {
        const res = await fetch(API_URL);
        songs = await res.json();

        if (!songs || songs.length === 0) {
          title.textContent = "कोई गाना नहीं मिला";
          artist.textContent = "ड्राइव फोल्डर चेक करें";
          statusText.textContent = "फ़ोल्डर खाली है";
          return;
        }

        statusText.style.display = "none";
        renderCarousel();
        loadSong(0);
      } catch (err) {
        title.textContent = "कनेक्शन त्रुटि";
        artist.textContent = "पुनः प्रयास करें";
        statusText.textContent = "गाना लोड नहीं हो सका";
      }
    }

    function renderCarousel() {
      track.innerHTML = "";
      const angleStep = 360 / Math.max(songs.length, 3);
      const radius = Math.max(160, songs.length * 35);

      songs.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = 'carousel-item';
        const angle = i * angleStep;
        item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
        item.innerHTML = `<img src="${song.photo}" alt="${song.title}">`;
        item.onclick = () => selectSong(i);
        track.appendChild(item);
      });
    }

    function rotateTrack(index) {
      const angleStep = 360 / Math.max(songs.length, 3);
      const currentAngle = -index * angleStep;
      track.style.transform = `rotateY(${currentAngle}deg)`;
    }

    function loadSong(index) {
      currentIndex = index;
      const currentSong = songs[currentIndex];
      title.textContent = currentSong.title;
      artist.textContent = "Hyper Music Official";
      audio.src = getAudioStreamUrl(currentSong);
      audio.load();
      rotateTrack(currentIndex);
    }

    function selectSong(index) {
      loadSong(index);
      audio.play().catch(e => console.log("User gesture required"));
      playBtn.textContent = "⏸";
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = "⏸";
        }).catch(err => {
          console.log("Play failed:", err);
        });
      } else {
        audio.pause();
        playBtn.textContent = "▶";
      }
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex);
      audio.play().catch(() => {});
      playBtn.textContent = "⏸";
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex);
      audio.play().catch(() => {});
      playBtn.textContent = "⏸";
    }

    audio.onended = () => nextSong();
    audio.onplay = () => playBtn.textContent = "⏸";
    audio.onpause = () => playBtn.textContent = "▶";

    fetchSongs();
  </script>
</body>
</html>
