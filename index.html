<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, #080c14 60%, #030712 100%);
      color: #f1f5f9;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* डिज़ाइनर ब्रांड लोगो हेडर */
    header {
      width: 100%;
      max-width: 480px;
      padding: 24px 0 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      position: relative;
    }

    /* स्टाइलिश नियॉन टेक्स्ट */
    .brand-title {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 10px #38bdf8);
      -webkit-text-fill-color: initial;
    }

    /* सब-टैग डिज़ाइन */
    .brand-subtitle {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 6px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 4px;
      padding-left: 6px;
    }

    /* डिवाइडर लाइन */
    .header-divider {
      width: 100%;
      max-width: 480px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #334155 50%, transparent 100%);
      margin: 18px 0 24px 0;
    }

    /* गानों की लिस्ट */
    .song-list {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* गाना कार्ड */
    .song-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .song-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .song-details {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }

    /* प्लेयर */
    audio {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      outline: none;
    }

    footer {
      margin-top: auto;
      padding-top: 36px;
      font-size: 11px;
      color: #475569;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- डिज़ाइनर हेडर -->
  <header>
    <div class="brand-container">
      <div class="brand-title">
        <span class="brand-icon">⚡</span> HYPER MUSIC
      </div>
      <div class="brand-subtitle">STUDIO SOUND</div>
    </div>
  </header>

  <div class="header-divider"></div>

  <!-- गानों की लिस्ट -->
  <div class="song-list">

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">🎵</div>
        <div class="song-details">
          <div class="song-title">Tere Rang Mein</div>
          <div class="song-sub">Official Track</div>
        </div>
      </div>
      <audio controls src=""></audio>
    </div>

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">✨</div>
        <div class="song-details">
          <div class="song-title">Naya Sa Khumaar</div>
          <div class="song-sub">Romantic Vibes</div>
        </div>
      </div>
      <audio controls src=""></audio>
    </div>

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">🌙</div>
        <div class="song-details">
          <div class="song-title">Tehrii Aik Nazzaar</div>
          <div class="song-sub">Melody Special</div>
        </div>
      </div>
      <audio controls src=""></audio>
    </div>

  </div>

  <footer>
    HYPER MUSIC • ALL RIGHTS RESERVED
  </footer>

</body>
</html>
