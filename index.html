<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPER MUSIC WITH AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #112240, #050b14, #020408);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding-bottom: 25px;
    }

    /* --- BRAND LOGO --- */
    header {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(10px);
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .logo-icon i {
      font-size: 1.1rem;
      color: #030712;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .logo-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sound-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 16px;
      margin-left: 6px;
    }

    .bar {
      width: 3px;
      background: #38bdf8;
      border-radius: 2px;
      animation: soundPulse 1.2s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 14px; animation-delay: 0.3s; }
    .bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }
    .bar:nth-child(4) { height: 16px; animation-delay: 0.4s; }

    @keyframes soundPulse {
      0% { transform: scaleY(0.4); opacity: 0.5; }
      100% { transform: scaleY(1.2); opacity: 1; }
    }

    /* --- SLIDER --- */
    .swiper {
      width: 100%;
      padding-top: 15px;
      padding-bottom: 25px;
    }

    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 240px;
      height: 240px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s;
    }

    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- PLAYER BOX --- */
    .player-container {
      width: 90%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 22px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .track-info h2 {
      font-size: 1.25rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .track-info p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* --- NEW CONTROLS & ULTRA PLAY BUTTON --- */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 22px;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 1.15rem;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .btn-control:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Cyber Glow Play Button */
    .play-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-play {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7f00ff 100%);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.4);
      position: relative;
      z-index: 2;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-play i {
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
      margin-left: 2px;
    }

    .btn-play:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
    }

    /* Outer Animated Pulse Wave */
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.4) 0%, rgba(127, 0, 255, 0) 75%);
      z-index: 1;
      opacity: 0;
      transform: scale(1);
      pointer-events: none;
    }

    .playing .pulse-ring {
      animation: pulseRipple 1.8s infinite ease-out;
    }

    @keyframes pulseRipple {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* --- PROGRESS --- */
    .progress-box {
      width: 100%;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .seek-bar {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.12);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px #38bdf8;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">
      <div class="logo-icon">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="logo-text">
        <span class="logo-title">HYPER MUSIC</span>
        <span class="logo-subtitle">WITH AI</span>
      </div>
      <div class="sound-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </header>

  <div class="swiper">
    <div class="swiper-wrapper" id="swiperWrapper"></div>
  </div>

  <div class="player-container">
    <div class="track-info">
      <h2 id="songTitle">लोड हो रहा है...</h2>
      <p>Hyper Music Official</p>
    </div>

    <div class="controls">
      <button class="btn-control" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
      
      <!-- Modern Play Button Wrapper -->
      <div class="play-btn-wrapper" id="playWrapper">
        <div class="pulse-ring"></div>
        <button class="btn-play" id="playBtn">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
      </div>

      <button class="btn-control" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
    </div>

    <div class="progress-box">
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <input type="range" class="seek-bar" id="seekBar" value="0" min="0" max="100">
    </div>

    <div class="status-msg" id="statusMsg">क्लाउड से गाने लोड हो रहे हैं...</div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const GITHUB_USER = "hypermusic-in";
    const GITHUB_REPO = "Hyper-Music-Web";

    let playlist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let swiper = null;

    const audio = document.getElementById('audioPlayer');
    const songTitle = document.getElementById('songTitle');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playWrapper = document.getElementById('playWrapper');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const statusMsg = document.getElementById('statusMsg');
    const swiperWrapper = document.getElementById('swiperWrapper');

    async function loadMusicFromReleases() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases`);
        const releases = await response.json();

        if (!releases || releases.length === 0) {
          statusMsg.textContent = "GitHub Releases में कोई गाना नहीं मिला।";
          return;
        }

        const audioFiles = {};
        const imageFiles = {};

        releases.forEach(rel => {
          if (rel.assets) {
            rel.assets.forEach(asset => {
              const fileName = asset.name;
              const dotIndex = fileName.lastIndexOf('.');
              if (dotIndex === -1) return;

              const baseName = fileName.substring(0, dotIndex).trim();
              const ext = fileName.substring(dotIndex + 1).toLowerCase();

              if (['mp3', 'wav', 'm4a'].includes(ext)) {
                audioFiles[baseName.toLowerCase()] = {
                  title: baseName,
                  url: asset.browser_download_url
                };
              } else if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                imageFiles[baseName.toLowerCase()] = asset.browser_download_url;
              }
            });
          }
        });

        playlist = [];
        for (let key in audioFiles) {
          playlist.push({
            title: audioFiles[key].title,
            audioUrl: audioFiles[key].url,
            posterUrl: imageFiles[key] || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800"
          });
        }

        if (playlist.length === 0) {
          statusMsg.textContent = "कृपया Release में MP3 फ़ाइलें अपलोड करें।";
          return;
        }

        buildCarousel();
        loadTrack(0);
        statusMsg.textContent = "";

      } catch (err) {
        console.error(err);
        statusMsg.textContent = "गाने लोड करने में त्रुटि आई।";
      }
    }

    function buildCarousel() {
      swiperWrapper.innerHTML = '';
      playlist.forEach(item => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `<img src="${item.posterUrl}" alt="${item.title}">`;
        swiperWrapper.appendChild(slide);
      });

      swiper = new Swiper('.swiper', {
        effect: 'coverflow',
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: 'auto',
        coverflowEffect: {
          rotate: 30,
          stretch: 0,
          depth: 150,
          modifier: 1.2,
          slideShadows: false,
        },
        on: {
          slideChange: function () {
            if (swiper.activeIndex !== currentIndex) {
              loadTrack(swiper.activeIndex);
              playSong();
            }
          }
        }
      });
    }

    function loadTrack(index) {
      currentIndex = index;
      const track = playlist[index];
      songTitle.textContent = track.title;
      audio.src = track.audioUrl;
      seekBar.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
    }

    function playSong() {
      audio.play().then(() => {
        isPlaying = true;
        playIcon.className = "fa-solid fa-pause";
        playIcon.style.marginLeft = "0px";
        playWrapper.classList.add('playing');
      }).catch(err => {
        console.error("Playback error:", err);
      });
    }

    function pauseSong() {
      audio.pause();
      isPlaying = false;
      playIcon.className = "fa-solid fa-play";
      playIcon.style.marginLeft = "2px";
      playWrapper.classList.remove('playing');
    }

    playBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      if (isPlaying) {
        pauseSong();
      } else {
        playSong();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      let newIndex = currentIndex - 1;
      if (newIndex < 0) newIndex = playlist.length - 1;
      swiper.slideTo(newIndex);
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      let newIndex = currentIndex + 1;
      if (newIndex >= playlist.length) newIndex = 0;
      swiper.slideTo(newIndex);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    function formatTime(sec) {
      let m = Math.floor(sec / 60);
      let s = Math.floor(sec % 60);
      if (s < 10) s = "0" + s;
      return `${m}:${s}`;
    }

    window.addEventListener('DOMContentLoaded', loadMusicFromReleases);
  </script>
</body>
</html>
