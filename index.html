<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Music - Official Song</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .player-card { background: #162033; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .brand-title { color: #38bdf8; font-size: 20px; font-weight: 700; margin-bottom: 18px; letter-spacing: 0.5px; }
    .cover-art { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; background: #0f172a; margin-bottom: 18px; border: 1px solid #334155; }
    .song-title { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 6px; }
    .artist-name { font-size: 14px; color: #94a3b8; margin-bottom: 22px; }
    audio { width: 100%; outline: none; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="brand-title">Hyper Music With AI</div>

    <!-- Album Poster -->
    <img class="cover-art" src="poster.jpg" alt="Song Poster" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop'">

    <!-- Song Details -->
    <div class="song-title">इश्क में रंग दी ये जिंदगानी हमारी</div>
    <div class="artist-name">Hyper Music Official</div>

    <!-- Direct Audio Player -->
    <audio controls>
      <source src="song.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

</body>
</html>
