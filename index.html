<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, #080c14 60%, #030712 100%);
      color: #f1f5f9;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 480px;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-title {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon { font-size: 22px; filter: drop-shadow(0 0 10px #38bdf8); -webkit-text-fill-color: initial; }
    .brand-subtitle {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .carousel-container {
      width: 100%;
      max-width: 420px;
      height: 260px;
      margin-top: 15px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .carousel {
      width: 185px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .carousel-item {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      background-size: cover;
      background-position: center;
      background-color: #111827;
      transition: border-color 0.3s;
    }
    .carousel-item.active {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), 0 14px 35px rgba(0,0,0,0.9);
    }
    .poster-badge { font-size: 9px; background: #0284c7; padding: 2px 7px; border-radius: 4px; width: fit-content; margin-bottom: 4px; font-weight: 700; color: #fff; }
    .poster-title { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

    .nav-btns { display: flex; gap: 14px; margin-top: 8px; }
    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .player-card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-top: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .track-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .track-name { font-size: 16px; font-weight: 800; color: #fff; }
    .track-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .audio-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid #0284c7; color: #38bdf8; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }

    audio { width: 100%; height: 38px; margin-top: 8px; outline: none; border-radius: 8px; }

    .ticker-box {
      margin-top: 12px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-text {
      display: inline-block;
      font-size: 11px;
      color: #facc15;
      animation: scrollLyrics 16s linear infinite;
    }
    @keyframes scrollLyrics {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    footer {
      font-size: 10px;
      color: #475569;
      text-align: center;
      margin-top: 15px;
      letter-spacing: 1px;
    }

    #statusMsg {
      font-size: 13px;
      color: #38bdf8;
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title"><span class="brand-icon">⚡</span> HYPER MUSIC</div>
    <div class="brand-subtitle">STUDIO SOUND</div>
  </header>

  <div id="statusMsg">Google Drive से गाने कनेक्ट हो रहे हैं...</div>

  <div class="carousel-container" id="carouselContainer" style="display: none;">
    <div class="carousel" id="carousel"></div>
  </div>

  <div class="nav-btns" id="navBtns" style="display: none;">
    <button class="nav-btn" onclick="rotate(-1)">◀</button>
    <button class="nav-btn" onclick="rotate(1)">▶</button>
  </div>

  <div class="player-card" id="playerCard" style="display: none;">
    <div class="track-meta">
      <div>
        <div class="track-name" id="songTitle">--</div>
        <div class="track-sub">Hyper Music Studio Official</div>
      </div>
      <div class="audio-badge">Hi-Fi Audio</div>
    </div>

    <audio id="mainPlayer" controls src=""></audio>

    <div class="ticker-box">
      <div class="ticker-text" id="lyricsText">
        🎵 Hyper Music Studio • Live Audio
      </div>
    </div>
  </div>

  <footer>HYPER MUSIC • ALL RIGHTS RESERVED</footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7f-iGWIsolXHvFxEySnqxds4POch17S3_8NIat2wP34ykGBtXdxomJ7K6tnEWULV_mQ/exec";

    let songs = [];
    let currentIndex = 0;
    let angleStep = 120;

    async function loadMusic() {
      try {
        const response = await fetch(SCRIPT_URL);
        songs = await response.json();

        if (songs && songs.length > 0) {
          document.getElementById('statusMsg').style.display = 'none';
          document.getElementById('carouselContainer').style.display = 'flex';
          document.getElementById('navBtns').style.display = 'flex';
          document.getElementById('playerCard').style.display = 'block';

          buildCarousel();
          setTrack(0);
        } else {
          document.getElementById('statusMsg').textContent = "Google Drive में कोई गाना नहीं मिला। फोल्डर चेक करें।";
        }
      } catch (err) {
        document.getElementById('statusMsg').textContent = "गाने लोड करने में त्रुटि आई।";
      }
    }

    function buildCarousel() {
      const carousel = document.getElementById('carousel');
      carousel.innerHTML = "";
      angleStep = 360 / Math.max(songs.length, 3);

      songs.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'carousel-item';
        card.style.transform = `rotateY(${i * angleStep}deg) translateZ(160px)`;
        card.style.backgroundImage = `linear-gradient(180deg, transparent 40%, rgba(9,13,22,0.95)), url('${song.photo}')`;
        card.onclick = () => setTrack(i);

        card.innerHTML = `
          <span class="poster-badge">TRACK 0${i + 1}</span>
          <div class="poster-title">${song.title}</div>
        `;
        carousel.appendChild(card);
      });
    }

    function rotate(dir) {
      if (songs.length === 0) return;
      currentIndex = (currentIndex + dir + songs.length) % songs.length;
      updatePlayback();
    }

    function setTrack(i) {
      currentIndex = i;
      updatePlayback();
    }

    function updatePlayback() {
      document.getElementById('carousel').style.transform = `rotateY(${currentIndex * -angleStep}deg)`;
      const current = songs[currentIndex];

      document.getElementById('songTitle').textContent = current.title;
      document.getElementById('lyricsText').textContent = `🎵 Now Playing: ${current.title} • Hyper Music Studio Track`;

      const player = document.getElementById('mainPlayer');
      player.src = current.audioUrl;
      player.load();
      player.play().catch(() => {});
    }

    loadMusic();
  </script>
</body>
</html>
