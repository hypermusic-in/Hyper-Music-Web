<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, #080c14 60%, #030712 100%);
      color: #f1f5f9;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* डिज़ाइनर लोगो */
    header {
      width: 100%;
      max-width: 480px;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-title {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon { font-size: 22px; filter: drop-shadow(0 0 10px #38bdf8); -webkit-text-fill-color: initial; }
    .brand-subtitle {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* 3D पोस्टर कैरोसेल */
    .carousel-container {
      width: 100%;
      max-width: 420px;
      height: 250px;
      margin-top: 15px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .carousel {
      width: 180px;
      height: 230px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .carousel-item {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      background-size: cover;
      background-position: center;
      background-color: #111827;
    }

    .carousel-item:nth-child(1) { transform: rotateY(0deg) translateZ(150px); }
    .carousel-item:nth-child(2) { transform: rotateY(120deg) translateZ(150px); }
    .carousel-item:nth-child(3) { transform: rotateY(240deg) translateZ(150px); }

    .poster-badge { font-size: 9px; background: #0284c7; padding: 2px 7px; border-radius: 4px; width: fit-content; margin-bottom: 4px; font-weight: 700; color: #fff; }
    .poster-title { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

    .nav-btns { display: flex; gap: 14px; margin-top: 8px; }
    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    /* नीचे का प्लेयर */
    .player-card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-top: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .track-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .track-name { font-size: 16px; font-weight: 800; color: #fff; }
    .track-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .audio-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid #0284c7; color: #38bdf8; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }

    audio { width: 100%; height: 36px; margin-top: 8px; outline: none; }

    .ticker-box {
      margin-top: 12px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-text {
      display: inline-block;
      font-size: 11px;
      color: #facc15;
      animation: scrollLyrics 15s linear infinite;
    }
    @keyframes scrollLyrics {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    footer {
      font-size: 10px;
      color: #475569;
      text-align: center;
      margin-top: 15px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <header>
    <div class="brand-title"><span class="brand-icon">⚡</span> HYPER MUSIC</div>
    <div class="brand-subtitle">STUDIO SOUND</div>
  </header>

  <!-- 3D पोस्टर कैरोसेल -->
  <div class="carousel-container">
    <div class="carousel" id="carousel">
      <!-- कार्ड 1: सीधे उसी नाम की फोटो लेगा -->
      <div class="carousel-item" id="card0" style="background-image: linear-gradient(180deg, transparent 40%, rgba(9,13,22,0.95)), url('Tere Rang Mein.jpg');" onclick="selectTrack(0)">
        <span class="poster-badge">NOW PLAYING</span>
        <div class="poster-title">Tere Rang Mein</div>
      </div>
      <!-- कार्ड 2 -->
      <div class="carousel-item" id="card1" style="background-image: linear-gradient(180deg, transparent 40%, rgba(9,13,22,0.95)), url('Naya Sa Khumaar.jpg');" onclick="selectTrack(1)">
        <span class="poster-badge">TRACK 02</span>
        <div class="poster-title">Naya Sa Khumaar</div>
      </div>
      <!-- कार्ड 3 -->
      <div class="carousel-item" id="card2" style="background-image: linear-gradient(180deg, transparent 40%, rgba(9,13,22,0.95)), url('Tehrii Aik Nazzaar.jpg');" onclick="selectTrack(2)">
        <span class="poster-badge">TRACK 03</span>
        <div class="poster-title">Tehrii Aik Nazzaar</div>
      </div>
    </div>
  </div>

  <div class="nav-btns">
    <button class="nav-btn" onclick="rotate(-1)">◀</button>
    <button class="nav-btn" onclick="rotate(1)">▶</button>
  </div>

  <!-- नीचे प्लेयर -->
  <div class="player-card">
    <div class="track-meta">
      <div>
        <div class="track-name" id="songTitle">Tere Rang Mein</div>
        <div class="track-sub">Hyper Music Official Track</div>
      </div>
      <div class="audio-badge">Hi-Fi Audio</div>
    </div>

    <!-- गाना उसी नाम से सीधे प्ले होगा -->
    <audio id="mainPlayer" controls src="Tere Rang Mein.mp3"></audio>

    <div class="ticker-box">
      <div class="ticker-text" id="lyricsText">
        🎵 तेरे रंग में रंगे हैं नैना... हाइपर म्यूजिक ऑफिशियल स्टूडियो ट्रैक...
      </div>
    </div>
  </div>

  <footer>HYPER MUSIC • ALL RIGHTS RESERVED</footer>

  <script>
    let currentAngle = 0;
    let currentIndex = 0;

    // वही नाम जो गाने और फोटो दोनों के लिए रहेगा
    const songs = [
      { name: "Tere Rang Mein", file: "Tere Rang Mein.mp3", lyrics: "🎵 तेरे रंग में रंगे हैं नैना... हाइपर म्यूजिक ऑफिशियल स्टूडियो ट्रैक..." },
      { name: "Naya Sa Khumaar", file: "Naya Sa Khumaar.mp3", lyrics: "🎵 नया सा खुमार रूह में उतरने लगा... हाइपर म्यूजिक ओरिजिनल..." },
      { name: "Tehrii Aik Nazzaar", file: "Tehrii Aik Nazzaar.mp3", lyrics: "🎵 ठहरी एक नज़र जो उन पर... धड़कनों ने नया साज़ छेड़ दिया..." }
    ];

    function rotate(direction) {
      currentIndex = (currentIndex + direction + 3) % 3;
      applyRotation();
    }

    function selectTrack(index) {
      currentIndex = index;
      applyRotation();
    }

    function applyRotation() {
      currentAngle = currentIndex * -120;
      document.getElementById('carousel').style.transform = `rotateY(${currentAngle}deg)`;
      
      const track = songs[currentIndex];
      document.getElementById('songTitle').textContent = track.name;
      document.getElementById('lyricsText').textContent = track.lyrics;
      
      const player = document.getElementById('mainPlayer');
      player.src = track.file;
      player.play().catch(() => {});
    }
  </script>
</body>
</html>
